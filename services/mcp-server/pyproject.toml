[project]
name = "mcp-server"
version = "0.1.0"
description = "TARS MCP protocol adapter — exposes tars-core as MCP tools"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "tars-core",
    "mcp>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.uv.sources]
tars-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server"]
