[project]
name = "tars-core"
version = "0.1.0"
description = "TARS Diagnostics domain — database-agnostic execution plan, schema, and lock analysis"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "psycopg[binary,pool]>=3.2",
    "mssql-python",
    "sqlglot>=27.0",
    "cryptography>=43",
]
# No pydantic here on purpose — the domain layer uses stdlib dataclasses,
# not Pydantic. See docs/adr/0012-domain-layer-uses-dataclasses-not-pydantic.md.
# If infrastructure/ ever needs Pydantic for its own serialization, add it
# back explicitly with a comment explaining why, not as a domain dependency.

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tars_core"]
